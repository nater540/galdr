[package]
name = "skirnir"
version = "0.1.0"
edition = "2024"

# `skirnir` is the native Linux GCode sender. The crate is split into a framework-agnostic library (the
# streaming engine, exported from `lib.rs`) and a thin binary (`main.rs`). The engine talks to the world
# ONLY through the `Transport` trait, so it is fully host-testable against an in-memory fake and depends on
# neither a GUI nor `tokio-serial` directly. The future egui UI will drive the engine over channels.
[lib]
name = "skirnir"
path = "src/lib.rs"

[[bin]]
name = "skirnir"
path = "src/main.rs"

# Features. `gui` pulls in egui/eframe + rfd and is default-on, so `cargo run` launches the window out of the
# box. `serial` pulls in the real USB-CDC transport (`tokio-serial`), also default-on so the app talks to
# hardware by default. Tests need neither: the protocol/engine/reducer suites run headless against the
# in-memory loopback transport, fully exercising the streaming contract without a window or a real port. A
# `--no-default-features` build (e.g. CI logic checks) is headless and loopback-only.
[features]
default = ["gui", "serial"]
gui = ["dep:eframe", "dep:rfd", "dep:egui_tiles"]
serial = ["dep:tokio-serial"]

[dependencies]
# The shared CNC kinematics core (GCode parser + planner + motion timing). Skirnir drives the SAME planner
# the firmware runs, offline, to estimate job time — so the ETA cannot drift from the board's motion. The
# `sim` feature pulls in the host-side `simulate` driver (it allocates); `default-features = false` skips the
# firmware-only `defmt`.
cnc-kinematics = { path = "../cnc-kinematics", default-features = false, features = ["sim"] }
# Async runtime + primitives for the engine's driver task and the UI<->engine channels. We keep the feature
# set tight: the multi-threaded runtime, the proc-macros, async I/O helpers, sync channels, timers, and the
# `signal` handler the headless `--cli` harness uses for a clean Ctrl-C (soft-reset + disconnect) abort.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "signal"] }
# Production `Transport` over USB CDC serial, gated behind the `serial` feature. Kept behind the trait so the
# engine never references it; only the `transport::serial` adapter touches this crate. `optional` so a
# loopback-only build (e.g. tests) need not pull the native serialport stack.
tokio-serial = { version = "5.5", optional = true }
# Typed engine/transport errors (`thiserror`) and ergonomic app-level error flow in the binary (`anyhow`).
# Both already exist in the workspace lock at these majors.
thiserror = "2"
anyhow    = "1"
# The profile/project store (DOC-11 §1.3): serde-derived state persisted as human-readable RON under the OS
# config dir. Framework-agnostic — NOT eframe's `Storage` — so the headless `--cli` path and the GUI share one
# store and the whole thing unit-tests as a pure round-trip. `serde` unifies on the workspace's existing 1.x;
# `ron` is the egui ecosystem's native format; `directories` locates `~/.config/skirnir` (XDG on Linux).
serde       = { version = "1", features = ["derive"] }
ron         = "0.12"
directories = "6"
# The curated per-setting tooltip descriptions are a runtime-loaded JSON object under the same config dir; the
# bundled `assets/setting_descriptions.json` is embedded as the first-run seed + fallback. `serde_json` parses it.
serde_json  = "1"
# Internationalization via Project Fluent (Fluent only — no gettext or other backend). The umbrella `fluent`
# crate re-exports `FluentBundle`/`FluentResource`/`FluentArgs`; `intl-memoizer` provides the concurrent
# memoizer that makes a bundle `Sync` (so the global `RwLock<Translator>` crosses threads); `unic-langid`
# names the `LanguageIdentifier` we parse locale tags into. These majors align: fluent 0.17 -> fluent-bundle
# 0.16 -> unic-langid 0.9 / intl-memoizer 0.5. Always-on (the i18n layer is pure and serves the CLI + GUI).
fluent        = "0.17"
intl-memoizer = "0.5"
unic-langid   = "0.9"
# The egui application framework, gated behind `gui`. We use the lightweight glow (OpenGL) backend rather than
# wgpu — a 2D toolpath `Painter` needs nothing heavier — and drop accesskit / web-screen-reader. `x11` and
# `wayland` cover both Linux display stacks. egui itself is consumed via `eframe::egui` (no direct dep).
eframe = { version = "0.35", optional = true, default-features = false, features = [
  "default_fonts",
  "glow",
  "x11",
  "wayland",
] }
# Native open/save file dialogs (G-code load) via the XDG Desktop Portal. 0.17 dropped its tokio runtime, so
# there is no runtime conflict with our tokio dependency.
rfd = { version = "0.17.2", optional = true }
# The viewport/console split is an egui_tiles tree (rerun-io's tiling layout engine). Adopted by user decision
# after three hand-rolled resizable-panel fixes went green in the harness but kept self-resizing on the desktop:
# tiles sizes panes top-down from SHARES, so pane content can never feed back into the split. Only the central
# viewport/dock divider is tiles-managed — the fixed chrome (toolbar, banners, status bar, columns) stays
# hand-rolled and deliberately non-rearrangeable (dragging is disabled via `Behavior`). Pinned to 0.15 (the
# egui 0.34 match; 0.16 needs egui 0.35). `serde` is off — the dock share persists through `profile.ron`.
egui_tiles = { version = "0.16", optional = true, default-features = false }

[dev-dependencies]
# The egui UI test harness (kittest + AccessKit), version-matched to egui 0.34. The interaction tests drive
# real pointer input over egui's tessellation only and run headless/CI-clean with no GPU. The `wgpu` +
# `snapshot` features additionally enable the IMAGE-snapshot path (`src/app/snapshot_test.rs`): offscreen
# wgpu renders diffed against committed PNG baselines under `tests/snapshots/`. Those tests are `#[ignore]`d
# so a plain `cargo test` (and GPU-less CI) never requires a GPU — run them explicitly with
# `cargo test -p skirnir -- --ignored snapshot` (and `UPDATE_SNAPSHOTS=1` to regenerate baselines). The
# harness + its tests are `#[cfg(all(test, feature = "gui"))]` (they need `eframe::egui`), so they compile
# only for the gui-featured test build; a `--no-default-features` test run skips them.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu", "snapshot"] }
# The current-thread runtime + test macro are enough to drive the async engine tests; paused-time helpers
# come from the `time` feature already enabled above.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "io-util", "time", "test-util"] }
