# The firmware crate targets `xtensa-esp32s3-none-elf`, which upstream Rust/LLVM does not support. The
# Espressif Rust fork (installed via `espup install`, registered with rustup as the `esp` toolchain)
# provides the Xtensa-enabled rustc plus the `rust-src` that `build-std` compiles `core` from. Pinning
# the channel here means `cargo build` invoked from within this crate selects the esp toolchain
# automatically — the documented `cd crates/firmware && cargo build` works without a `+esp` override.
#
# This file is scoped to crates/firmware: rustup walks up from the cwd and the nearest rust-toolchain
# file wins, so a plain `cargo build`/`cargo test` at the repo root still uses the host stock toolchain
# for firmware-core and skirnir (which are kept out of the firmware target via default-members + this
# crate's .cargo/config.toml). Source `$HOME/export-esp.sh` first so the Xtensa LLVM is on PATH.
[toolchain]
channel = "esp"
