[package]
name    = "firmware"
version = "0.1.0"
edition = "2024"

# This crate only ever builds for `xtensa-esp32s3-none-elf`. The Xtensa target is selected by this
# crate's `.cargo/config.toml` `[build] target` (effective when cargo is invoked from within this
# directory). It is also kept OUT of the workspace `default-members`, so a plain `cargo build`/
# `cargo test` at the repo root stays on the host's stock toolchain and never tries to compile
# esp-hal for the host. Build/flash with the Espressif Rust fork (espup); see CLAUDE.md.
# NOTE: `package.forced-target` would be the ideal pin but is nightly-only (`per-package-target`),
# and its mere presence fails manifest parsing on the stable host toolchain — so we use the
# `.cargo/config.toml` + `default-members` exclusion mechanism instead, which works on stable.

# esp-hal is exact-pinned and esp-rtos is exact-pinned: esp-rtos 0.3 is tightly coupled to a specific
# esp-hal API surface, and esp-hal must stay at 1.1.x (esp-rtos 0.3 requires esp-hal `~1.1`). Pinning both
# keeps the runtime family from floating apart on `cargo update`. Reproducibility also relies on committing
# Cargo.lock, which carries the exact embassy-* minors esp-rtos was resolved against.
[dependencies]
firmware-core     = { path = "../firmware-core", default-features = false }
galdr-proto       = { path = "../galdr-proto", default-features = false }
esp-hal           = { version = "=1.1.1", features = ["esp32s3", "unstable"] }
esp-rtos          = { version = "=0.3.0", features = ["esp32s3", "embassy"] }
embassy-executor  = { version = "0.10.0", features = ["executor-interrupt", "executor-thread"] }
embassy-time      = "0.5.0"
embassy-sync      = "0.8"
embassy-futures   = "0.1"
# `panic-handler` is DELIBERATELY OMITTED: this firmware installs its OWN `#[panic_handler]` (in `main.rs`) that
# records a PANIC breadcrumb to RTC_FAST and `software_reset()`s, so a panic (incl. a core-1 stack overflow) becomes
# VISIBLE + RECOVERABLE instead of esp-backtrace 0.19's default `interrupt_free(|| loop {})` silent forever-halt.
# Two `#[panic_handler]`s would be a duplicate-lang-item error, so esp-backtrace must NOT provide one. esp-backtrace
# 0.19 has no `exception-handler` feature (removed upstream); esp-hal owns the CPU exception vector and routes faults
# into whatever `#[panic_handler]` is linked — i.e. OURS — so hard-fault/illegal-instruction capture is not lost.
# `println` is kept (it only pulls esp-println; installs no lang item) so a default-build serial monitor still gets
# boot diagnostics; the panic handler itself does NOT print (minimal-stack, overflow-safe).
esp-backtrace     = { version = "0.19.0", features = ["esp32s3", "println"] }
esp-println       = { version = "0.17.0", features = ["esp32s3"] }
esp-storage       = { version = "0.9.0",  features = ["esp32s3"] }
embedded-storage  = "0.3"
embedded-io-async = "0.7"
# `sequential-storage` is the wear-leveled key/value flash store for the settings record (DOC-04). It is
# async-only, so esp-storage's blocking flash is bridged with `embassy-embedded-hal`'s `BlockingAsync`.
# `heapless-09` matches the workspace heapless.
sequential-storage   = { version = "7.2.0", default-features = false, features = ["heapless-09"] }
embassy-embedded-hal = { version = "0.6.0", default-features = false }
# Pinned to =0.5.0 to match esp-hal 1.1.x's linker convention. esp-hal 1.1.0's `ld/sections/rodata.x`
# renamed the app-descriptor section to `.flash.appdesc` (to align with esptool), and esp-bootloader-esp-idf
# 0.5.0 (#4745, 2026-04-16) made the matching change to where it emits `ESP_APP_DESC`. The two MUST move
# together: pairing esp-hal 1.1 with bootloader 0.4.0 (or 1.0 with 0.5.0) misplaces the descriptor and the
# board boot-loops with a bogus "efuse blk rev >= v116.31". This pairing finally retires the old 0.4.0 pin
# that the esp-hal 1.0 linker required.
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32s3"] }
heapless          = "0.9"
libm              = "0.2"
defmt             = { version = "1", optional = true }
static_cell       = "2"
# `portable-atomic` supplies the atomic types esp-hal 1.1's `Persistable` marker is implemented for
# (`unsafe impl Persistable for portable_atomic::AtomicU32`, NOT `core::sync::atomic`). The RTC_FAST crash
# breadcrumb (`crash.rs`) is a `static [portable_atomic::AtomicU32; N]` under `#[ram(unstable(rtc_fast,
# persistent))]`, so it must use this crate's atomics to satisfy that bound. Resolves to the same instance
# esp-hal already pulls (single unified 1.x), so the trait impl applies to our type directly.
portable-atomic   = "1"

[dev-dependencies]
embedded-hal-mock = "0.11"

[features]
# Opt-in defmt logging. Forwards to firmware-core so the no-defmt path stays the default; build a
# logging image with `--features defmt`. Keeps a defmt-free release build available. `esp-println`'s
# `defmt-espflash` feature supplies the `#[defmt::global_logger]` sink, so a defmt build links — required
# now that `tmc` emits defmt logs.
#
# IMPORTANT (ESP32-S3): the defmt sink is NOT a separate RTT/JTAG channel — on the S3 it rides the SAME
# built-in USB-Serial-JTAG peripheral as the grbl GCode comms (`main` builds the link from
# `peripherals.USB_DEVICE`, and esp-println 0.17's default S3 backend is that same USB-Serial-JTAG). So you
# CANNOT stream GCode and watch defmt at once over the one USB port — one host owns it, and the byte streams
# would interleave/corrupt. A genuine separate RTT channel needs an EXTERNAL JTAG probe on the JTAG pads,
# which this board does not expose. For a both-cores-dead wedge, live defmt is doubly useless (the dead
# core-0 sink emits nothing at the moment of death). The lockup-capture path is therefore the RTC_FAST crash
# breadcrumb in `crash.rs`, emitted as a plain `[MSG:...]` over the normal grbl TX after the watchdog resets
# the board — it works in the DEFAULT (no-defmt) build. defmt remains an optional extra for bench tracing.
defmt = ["dep:defmt", "firmware-core/defmt", "esp-println/defmt-espflash"]

# DIAGNOSTIC streaming-lockup capture build (TIER 3, docs/streaming-lockup-investigation.md §17). When ENABLED,
# the residual unrecoverable-wedge paths (the `usb_tx` K-escape, and the dead-zone watchdog backstop) take a
# `software_reset()` and leave an RTC_FAST breadcrumb that the next boot replays as `[MSG:CRASH usbtx: ...]` —
# the ONLY way to read WHY a wedge happened on the next boot (RTC_FAST survives the CoreSw reset). This is the
# capture channel the open Signature-A (#20) / Signature-B (#21) investigation depends on; an operator runs it
# KNOWING the part is scrap (a mid-stream reset drops the in-flight gcode + the host aborts the stream).
#
# When DISABLED (the PRODUCTION DEFAULT), those same paths instead raise feed-hold + the LOCKED `ALARM:17`
# (MotorFault) + require re-home — the grbl lost-step-sync contract (§14.3), the only safe response for a
# first real cut: NEVER a silent `software_reset()` the host streams through (which would resume cutting in
# the wrong place and silently corrupt the part). TIER 1 (the single-chunk write-stage widening) already stops
# the K-escape firing on the COMMON Signature-A wedge in BOTH builds; this feature only governs what the
# RESIDUAL unrecoverable wedge does. The split is compile-time so the safety default has zero runtime branch
# and a diagnostic image can never accidentally ship armed.
capture-reset = []

# DIAGNOSTIC "provoke-and-capture" build (docs/streaming-lockup-investigation.md §17.14). DISABLES TIER 1's
# single-chunk write-stage lost-wake RECOVERY so a lost wake is NOT rescued in place and cascades exactly as it did on
# the PRE-fix build — letting the genuine in-stream Signature B reproduce at its native rate for capture with the
# now-complete instrument (survivable watchdog + `[MSG:RESET]` replay). It is PURELY a way to reproduce the HISTORICAL
# wedge for diagnosis; it is NEVER a production path. It composes WITH (and REQUIRES) `capture-reset` — provoking B
# without the capture channel armed is pointless (the wedge would leave no trace) and unsafe, so this feature pulls
# `capture-reset` in. The minimal lever is a single `#[cfg]` swap at the `usb_tx` write-stage classify call from the
# pure `classify_write_stage` to its host-tested no-recover sibling `classify_write_stage_no_recover`; the production
# `classify_write_stage` and the default build are byte-for-byte UNCHANGED. The K-escape + survivable watchdog +
# `[MSG:RESET]` replay all stay ON, so whichever way B manifests (K-escape reset, ISR-withhold→dog, or the §13.8
# alternating hard-lock) leaves a readable breadcrumb. Build+flash combo: `--features provoke-b` (pulls capture-reset).
provoke-b = ["capture-reset"]
