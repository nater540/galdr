syntax = "proto3";

// galdr machine settings schema (DOC-04). This single message is the source of truth for BOTH the on-flash
// persisted settings record AND the `$PBX` host-sync channel. No `package` is declared so micropb generates
// the types at the top level of the include, keeping the Rust re-export trivial.
//
// Field-number policy: grbl `$n` settings occupy the low numbers grouped by decade; TMC2209 driver settings
// (which are not classic grbl `$n`) live in a reserved high range (40+) so future grbl `$n` additions never
// collide. Per-axis values are flat `_x/_y/_z` triples rather than `repeated`, so the generated struct has
// plain scalar fields (no heapless container, no Option) and is ergonomic to convert to the firmware's
// fixed-3-axis `*Config` structs.

// The full persisted settings record. All fields are proto3 singular scalars => plain (non-optional) Rust
// fields. A reader applies defaults BEFORE decoding, so an absent field decodes to its grbl default, not zero.
message Settings {
  // --- grbl $0..$12 (step + general) ---
  uint32 step_pulse_us         = 1;   // $0  step pulse time, microseconds.
  uint32 step_idle_delay_ms    = 2;   // $1  stepper idle lock delay, milliseconds (255 = always on).
  uint32 step_invert_mask      = 3;   // $2  step port invert bitmask.
  uint32 dir_invert_mask       = 4;   // $3  direction port invert bitmask.
  uint32 status_report_mask    = 5;   // $10 status report field bitmask.
  float  junction_deviation_mm = 6;   // $11 junction deviation, mm.
  float  arc_tolerance_mm      = 7;   // $12 arc chord tolerance, mm.

  // --- grbl $20..$27 (limits + homing) ---
  // $21/$22 are grblHAL EXCLUSIVE BITMASKS, not booleans (see firmware-core settings). They are uint32 here so
  // the named flag bits round-trip. Wire-compatible upgrade from the old `bool` fields: a legacy `true` decodes
  // to 1 (bit0 = enabled), `false`/absent to 0 (disabled) — proto3 bool and uint32 share the varint encoding.
  bool   soft_limits_enable    = 8;   // $20 soft limits enable (grblHAL keeps this one a boolean).
  uint32 hard_limit_flags      = 9;   // $21 hard limits bitmask: b0 enable, b1 strict.
  uint32 homing_flags          = 10;  // $22 homing bitmask: b0 enable, b3 force-set-origin (others reserved).
  uint32 homing_dir_invert_mask = 11; // $23 homing direction invert bitmask.
  float  homing_feed_mm_min    = 12;  // $24 homing feed (locate) rate, mm/min.
  float  homing_seek_mm_min    = 13;  // $25 homing seek rate, mm/min.
  uint32 homing_debounce_ms    = 14;  // $26 homing switch debounce, milliseconds.
  float  homing_pulloff_mm     = 15;  // $27 homing pull-off distance, mm.

  // --- grbl $30..$31 (spindle) ---
  float  spindle_rpm_max       = 16;  // $30 maximum spindle speed, RPM.
  float  spindle_rpm_min       = 17;  // $31 minimum spindle speed, RPM.

  // --- grbl $100..$132 (per-axis kinematics, X/Y/Z) ---
  float  steps_per_mm_x        = 18;  // $100 steps per mm, X.
  float  steps_per_mm_y        = 19;  // $101 steps per mm, Y.
  float  steps_per_mm_z        = 20;  // $102 steps per mm, Z.
  float  max_rate_mm_min_x     = 21;  // $110 maximum rate, X (mm/min).
  float  max_rate_mm_min_y     = 22;  // $111 maximum rate, Y (mm/min).
  float  max_rate_mm_min_z     = 23;  // $112 maximum rate, Z (mm/min).
  float  accel_mm_s2_x         = 24;  // $120 acceleration, X (mm/s^2).
  float  accel_mm_s2_y         = 25;  // $121 acceleration, Y (mm/s^2).
  float  accel_mm_s2_z         = 26;  // $122 acceleration, Z (mm/s^2).
  float  max_travel_mm_x       = 27;  // $130 maximum travel, X (mm).
  float  max_travel_mm_y       = 28;  // $131 maximum travel, Y (mm).
  float  max_travel_mm_z       = 29;  // $132 maximum travel, Z (mm).

  // --- TMC2209 driver settings (not grbl $n; reserved range 40+) ---
  uint32 run_current_ma_x      = 40;  // RMS run current, X (mA).
  uint32 run_current_ma_y      = 41;
  uint32 run_current_ma_z      = 42;
  uint32 hold_current_ma_x     = 43;  // RMS hold current, X (mA).
  uint32 hold_current_ma_y     = 44;
  uint32 hold_current_ma_z     = 45;
  uint32 microsteps_x          = 46;  // microsteps per full step, X (power of two 1..=256).
  uint32 microsteps_y          = 47;
  uint32 microsteps_z          = 48;
  uint32 tmc_ihold_delay       = 49;  // IHOLD_IRUN.IHOLDDELAY.
  uint32 tmc_tpowerdown        = 50;  // TPOWERDOWN.
  uint32 tmc_tpwmthrs          = 51;  // TPWMTHRS StealthChop->SpreadCycle threshold.
  uint32 tmc_send_delay        = 52;  // SLAVECONF.SENDDELAY (units of 8 bit-times).
  float  tmc_r_sense_ohms      = 53;  // sense-resistor value, ohms.

  // --- grbl $6/$19 (probe, DOC-09 Phase C). Added after the TMC range; additive proto3 fields, no version bump. ---
  bool   probe_invert          = 54;  // $6  probe-pin invert (set 1 for a Normally-Open touch plate).
  bool   probe_pullup_disable  = 55;  // $19 probe-pin pull-up disable (0 = enabled, the passive-plate default).

  // --- grbl $481 (auto-report interval, DOC-08 Phase F). Additive proto3 field, no version bump. ---
  uint32 auto_report_interval_ms = 56; // $481 auto status report interval, ms (0 = disabled, else 100..=1000).

  // --- grbl $5 (limit-pin invert, DOC-06). Additive proto3 field, no version bump. ---
  bool   limit_invert          = 57;  // $5  limit-pin invert (0 = NC fail-safe high-triggered, 1 = inverted).

  // --- spindle delays (DOC-07). Additive proto3 fields after the highest prior tag, no version bump. These are
  // spindle settings but use the high reserved tag range (like the TMC block) so a future low-numbered grbl $n
  // never collides; the grbl $30..$31 spindle block above stays contiguous. ---
  float  spindle_on_delay_s      = 58; // $392 spindle on delay, seconds.
  float  spindle_reverse_dwell_s = 59; // $393 spindle reverse dwell, seconds.

  // --- 4th axis A (rotary about X, DOC-10). Appended after the highest prior tag; additive proto3 fields, no
  // version bump. An old 3-axis record lacks them and decodes to 0, then `sanitize` fills the A defaults. The
  // `_a` per-axis values mirror the `_x/_y/_z` flat-triple convention; index 3 of the firmware arrays maps here.
  // For a rotary A the units are degrees: steps_per_mm_a is steps/deg, max_rate_mm_min_a is deg/min, etc. ---
  float  steps_per_mm_a        = 60;  // $103 steps per degree, A.
  float  max_rate_mm_min_a     = 61;  // $113 maximum rate, A (deg/min).
  float  accel_mm_s2_a         = 62;  // $123 acceleration, A (deg/s^2).
  float  max_travel_mm_a       = 63;  // $133 maximum travel, A (deg); IGNORED for an axis marked rotary in $376.
  uint32 run_current_ma_a      = 64;  // RMS run current, A (mA).
  uint32 hold_current_ma_a     = 65;  // RMS hold current, A (mA).
  uint32 microsteps_a          = 66;  // microsteps per full step, A.

  // --- grbl $376 rotary-axes bitmask (DOC-10): bit N set => axis N is angular (degrees), continuous/rollover,
  // and exempt from G20/G21 inch scaling. Default 8 (bit 3 => A) is filled by `sanitize` only on a FRESH record;
  // a present 0 is honored (lets A be treated as a 4th linear axis), so this is NOT a zero-fill. ---
  uint32 rotary_mask           = 67;  // $376 rotary-axes bitmask.
}

// Note: the `$PBX` host-sync channel transfers a FULL `Settings` message in both directions (the host does a
// read-modify-write of the whole record). Single-field edits go through the grbl `$x=val` text path instead,
// so no partial-update/patch message is needed. If partial updates are wanted later, add an explicit-presence
// `SettingsPatch` here and a merge step in `firmware-core::settings`.

// The PERSISTENT coordinate data (Phase B, grbl `$#` parameters): the six G54-G59 work-coordinate-system
// offsets, the active WCS, and the G28/G30 predefined positions. This is a SEPARATE record from `Settings`
// (stored under its own NVS key) because coordinate data has a different lifecycle from `$n` settings (e.g.
// `$RST=#` clears it without touching settings) and is written far more often (every G10/G28.1). The session-
// only G92 and dynamic `G43.1` tool-length offset are DELIBERATELY ABSENT: grbl never persists them, and the
// firmware restores them to identity on reset. Per-axis values are flat `_x/_y/_z` triples, matching the
// `Settings` convention, so the generated struct has plain scalar fields convertible to the firmware's
// fixed-3-axis arrays. A reader applies defaults (all zero, G54 active) before decoding.
message Coordinates {
  uint32 active_wcs = 1;  // active coordinate system, 0 = G54 .. 5 = G59.

  // --- G54-G59 work-coordinate-system offsets (machine mm), one X/Y/Z triple per system ---
  float g54_x = 2;  float g54_y = 3;  float g54_z = 4;
  float g55_x = 5;  float g55_y = 6;  float g55_z = 7;
  float g56_x = 8;  float g56_y = 9;  float g56_z = 10;
  float g57_x = 11; float g57_y = 12; float g57_z = 13;
  float g58_x = 14; float g58_y = 15; float g58_z = 16;
  float g59_x = 17; float g59_y = 18; float g59_z = 19;

  // --- G28 / G30 predefined positions (machine mm) ---
  float g28_x = 20; float g28_y = 21; float g28_z = 22;
  float g30_x = 23; float g30_y = 24; float g30_z = 25;

  // --- 4th axis A (rotary about X, DOC-10): the A component of each WCS offset and predefined position.
  // Appended additively; an old record lacks them and decodes to 0 (A offset zero). For a rotary A these are
  // degrees. ---
  float g54_a = 26; float g55_a = 27; float g56_a = 28;
  float g57_a = 29; float g58_a = 30; float g59_a = 31;
  float g28_a = 32; float g30_a = 33;
}
