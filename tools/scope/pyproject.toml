[project]
name = "galdr-scope"
version = "0.1.0"
description = "Rigol DHO804 bench helper for Galdr STEP/DIR capture (screenshot, waveform export, lockup catcher)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyvisa>=1.14",
  "pyvisa-py>=0.7",
  "pyusb>=1.2",
]

[project.scripts]
scope-capture = "galdr_scope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galdr_scope"]
